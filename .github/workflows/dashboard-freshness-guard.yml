name: Dashboard freshness guard

on:
  workflow_dispatch:
  schedule:
    # UTC schedules: early checks, later source-recovery checks, and close checks (Beijing time).
    - cron: "23 23 * * *"
    - cron: "43 23 * * *"
    - cron: "3 0 * * *"
    - cron: "3 2 * * *"
    - cron: "3 3 * * *"
    - cron: "3 4 * * *"
    - cron: "3 9 * * *"
    - cron: "23 9 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: dashboard-freshness-guard
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check freshness and dispatch recovery
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(TZ=Asia/Shanghai date +%F)"
          beijing_hhmm="$(TZ=Asia/Shanghai date +%H%M)"
          snapshot_date="$(node -p "require('./data/current-snapshot.json').report_date")"
          snapshot_revision="$(node -p "require('./data/current-snapshot.json').run.revision_id")"
          snapshot_has_industry="$(node -p "require('./data/current-snapshot.json').metrics.some(m => m.indicator_id === 'M3-A01/03')")"
          edition=daily
          final_guard=false
          case "$EVENT_SCHEDULE" in
            "23 9 * * *") final_guard=true ;;
            "3 0 * * *") final_guard=true ;;
          esac
          if [ "$beijing_hhmm" -ge 1630 ]; then edition=close; fi

          fresh=false
          if [ "$snapshot_date" = "$report_date" ] && [ "$snapshot_has_industry" = "true" ]; then
            if [ "$edition" = "daily" ] || [[ "$snapshot_revision" == close* ]]; then
              fresh=true
            fi
          fi
          if [ "$fresh" = "true" ]; then
            echo "$report_date $edition snapshot is current; no recovery needed."
            exit 0
          fi

          revision_id=""
          if [ "$snapshot_date" = "$report_date" ]; then
            revision_id="${edition}-repair-$(TZ=Asia/Shanghai date +%H%M)"
          fi
          dispatch_args=(-f "ref=$GITHUB_REF_NAME" -f "inputs[edition]=$edition" -F "inputs[only_if_stale]=true" -F "inputs[alert_on_recovery]=$final_guard")
          if [ -n "$revision_id" ]; then
            dispatch_args+=(-f "inputs[revision_id]=$revision_id")
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-dashboard.yml/dispatches" \
            "${dispatch_args[@]}"
          echo "Dispatched $edition recovery for $report_date."
